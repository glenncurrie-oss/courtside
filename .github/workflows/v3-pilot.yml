name: Courtside V3 NCAA pilot
on:
  workflow_dispatch:
    inputs:
      ncaa_backfill:
        description: "Scan NCAA season since October (slower)"
        type: boolean
        default: true
  schedule:
    - cron: '43 5 * * *'
permissions:
  contents: write
jobs:
  ncaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect NCAA player results
        env:
          COURTSIDE_NCAA_BACKFILL: ${{ inputs.ncaa_backfill && '1' || '0' }}
        run: python scripts/update_ncaa.py
      - name: Commit NCAA data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaa_mbb.json data/ncaa_wbb.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Courtside NCAA pilot data'
            git push
          fi
